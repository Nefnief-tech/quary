// Quarry node agent protocol. The panel serves NodeAgentService; node
// daemons dial out to the panel (no inbound ports on game hosts).
syntax = "proto3";

package quarry.node.v1;

option go_package = "quarry.dev/quarry/proto/gen/go/quarry/node/v1;nodesv1";

// NodeAgentService is served by the panel; node daemons act as gRPC clients.
// A fresh daemon's first call is RegisterNode, exchanging a single-use
// enrollment token for a signed client certificate. Every subsequent RPC
// must present that client certificate (mTLS); the node identity is taken
// from the certificate, never from request payloads.
service NodeAgentService {
  // Enrolls a daemon: validates the enrollment token, signs the daemon's CSR
  // and returns the node identity. The private key never leaves the daemon.
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);

  // Bidirectional heartbeat stream. The daemon sends a HeartbeatRequest
  // every ~10 seconds; the panel acks each beat (later: carrying desired
  // configuration and reload hints).
  rpc Heartbeat(stream HeartbeatRequest) returns (stream HeartbeatResponse);

  // Channel is the long-lived bidirectional command stream. The daemon opens
  // it after enrolling; the panel pushes server commands down it, the daemon
  // streams events (console, stats, status) and command results back.
  rpc Channel(stream ChannelRequest) returns (stream ChannelResponse);
}

message RegisterNodeRequest {
  // Single-use enrollment token issued via the panel admin API.
  string enrollment_token = 1;
  // Human-readable node name from the daemon config; must match the node
  // record the token was issued for.
  string name = 2;
  // PEM-encoded PKCS#10 certificate signing request for the daemon's
  // long-term key. The panel overrides any SANs in the CSR.
  bytes csr_pem = 3;
  // Descriptive information about the daemon host.
  DaemonInfo info = 4;
}

message RegisterNodeResponse {
  string node_id = 1;
  // The panel CA certificate (PEM), so the daemon can verify the panel on
  // every later connection.
  bytes ca_pem = 2;
  // Signed client certificate (PEM) for the daemon's key.
  bytes cert_pem = 3;
}

message DaemonInfo {
  string daemon_version = 1;
  string hostname = 2;
  string docker_version = 3;
  string os = 4;
  string arch = 5;
  // Address game clients' browsers can reach for ports the daemon
  // publishes (e.g. the map webserver). Defaults to hostname on the wire
  // when unset; the panel stores it on the node record.
  string public_host = 6;
}

message HeartbeatRequest {
  uint64 uptime_seconds = 1;
  DaemonInfo info = 2;
  // Milliseconds since the Unix epoch, per the daemon's clock.
  int64 sent_at_unix_milli = 3;
}

message HeartbeatResponse {
  // Milliseconds since the Unix epoch, per the panel's clock.
  int64 server_time_unix_milli = 1;
}

// ---------------------------------------------------------------------------
// Channel: commands (panel → daemon) and events/results (daemon → panel).
// ---------------------------------------------------------------------------

// NodeDownstream carries a panel command to the daemon.
message ChannelResponse {
  Command command = 1;
}

// NodeUpstream carries events and command results back to the panel.
message ChannelRequest {
  oneof payload {
    Event event = 1;
    CommandResult result = 2;
  }
}

// Command is one instruction from the panel to the daemon. Every command
// carries a correlation id echoed back in CommandResult.
message Command {
  string correlation_id = 1;
  oneof action {
    InstallServer install_server = 2;
    StartServer start_server = 3;
    StopServer stop_server = 4;
    KillServer kill_server = 5;
    SendCommand send_command = 6;
    ListFiles list_files = 7;
    ReadFile read_file = 8;
    WriteFile write_file = 9;
    DeleteFile delete_file = 10;
    InstallPlugin install_plugin = 11;
    RunConsole run_console = 12;
    ExposeStart expose_start = 13;
    ExposeClaim expose_claim = 14;
    ExposeStop expose_stop = 15;
  }
}

// ExposeStart begins tunnel setup for a server. Provider selects the
// tunnel technology; the default (empty) is playit. For frp the panel
// supplies its frps endpoint, auth token and the remote port to claim.
// Result JSON: {"claim_url":"…","code":"…"} for playit,
// {"active":true,"address":"host:port"} for frp.
message ExposeStart {
  string server_id = 1;
  string provider = 2;
  // frp-only fields (ignored by other providers).
  string frps_addr = 3;
  int32 frps_port = 4;
  string frps_token = 5;
  int32 remote_port = 6;
  // The server's game port on the node; frpc forwards it.
  int32 local_port = 7;
}

// ExposeClaim exchanges a claimed code for the agent secret (if the user
// has completed the browser claim), stores it and starts the agent.
// Result JSON: {"active":true} on success, {"active":false} while the
// claim is still pending.
message ExposeClaim {
  string server_id = 1;
}

// ExposeStop halts the server's tunnel agent and forgets its secret.
message ExposeStop {
  string server_id = 1;
  string provider = 2; // empty = playit
}

// RunConsole writes one line to the server console and captures reply lines
// that match a RE2 pattern (the daemon compiles it; RE2 has no catastrophic
// backtracking). The result body is JSON: {"lines":["…"]}. Used for `list`,
// `whitelist list` and similar read-only console queries.
message RunConsole {
  string server_id = 1;
  string input = 2;
  // RE2 pattern reply lines must match to be captured.
  string expect = 3;
  // Stop after this many matching lines (default 1).
  int32 max_lines = 4;
}

// InstallPlugin downloads a marketplace jar into the server's content
// directory (plugins/ or mods/). The checksum published by the marketplace
// is verified before the file lands.
message InstallPlugin {
  string server_id = 1;
  // Marketplace download URL; the daemon rejects private addresses.
  string url = 2;
  // SHA-256 or SHA-512 hex checksum, whichever the source publishes.
  string sha256 = 3;
  string sha512 = 4;
  // Path relative to the server data directory, including the content dir
  // prefix the panel derives from the runner ("plugins/…" or "mods/…").
  string filename = 5;
}

message InstallServer {
  string server_id = 1;
  string runner = 2;
  string mc_version = 3;
  // Where to fetch the artifact (checksum-verified by the daemon).
  string artifact_url = 4;
  string artifact_sha256 = 5;
  string artifact_name = 6;
  // Docker image to use for the run phase.
  string image = 7;
  // Launch command executed in the container (argv).
  repeated string launch = 8;
  // Memory limit in MiB.
  int32 memory_mb = 9;
  // Allocated address the server should bind inside the container.
  string bind_ip = 10;
  int32 bind_port = 11;
  // Additional checksum-verified downloads (e.g. the BlueMap jar) placed
  // relative to the server data directory at install time.
  repeated ExtraFile extras = 12;
}

// ExtraFile is one auxiliary download installed alongside the server
// artifact. filename is relative to the server data directory.
message ExtraFile {
  string url = 1;
  string sha256 = 2;
  string sha512 = 3;
  string filename = 4;
}

message StartServer {
  string server_id = 1;
  string image = 2;
  repeated string launch = 3;
  int32 memory_mb = 4;
  int32 cpu_percent = 5; // 100 = one core
  string bind_ip = 6;
  int32 bind_port = 7;
  // Optional second binding for the embedded map webserver (BlueMap),
  // which always listens on container port 8100. Zero = no map.
  string map_bind_ip = 8;
  int32 map_port = 9;
}

message StopServer {
  string server_id = 1;
  // Seconds to wait after the graceful console stop before killing.
  int32 timeout_seconds = 2;
}

message KillServer {
  string server_id = 1;
}

message SendCommand {
  string server_id = 1;
  string input = 2;
}

message ListFiles {
  string server_id = 1;
  // Path relative to the server's data directory.
  string path = 2;
}

message ReadFile {
  string server_id = 1;
  string path = 2;
  // Files larger than this are rejected; the web editor is for config files.
  int32 max_bytes = 3;
}

message WriteFile {
  string server_id = 1;
  string path = 2;
  bytes content = 3;
  bool create_dirs = 4;
}

message DeleteFile {
  string server_id = 1;
  string path = 2;
  bool recursive = 3;
}

// CommandResult is the terminal response for a correlation id. Payloads are
// encoded per-command as JSON in `body` to keep the surface small; typed
// messages arrive as streaming Events.
message CommandResult {
  string correlation_id = 1;
  bool ok = 2;
  string error = 3;
  bytes body = 4;
}

message Event {
  string server_id = 1;
  oneof payload {
    ConsoleLine console = 2;
    ServerStats stats = 3;
    StatusChange status = 4;
    InstallProgress install_progress = 5;
  }
}

message ConsoleLine {
  // Milliseconds since the Unix epoch, per the daemon's clock.
  int64 at_unix_milli = 1;
  string line = 2;
  // stdin echoes are flagged so the UI can style them.
  bool from_stdin = 3;
}

message ServerStats {
  double cpu_percent = 1;
  double memory_used_mb = 2;
  double memory_limit_mb = 3;
  double disk_used_mb = 4;
  double network_rx_bytes_per_sec = 5;
  double network_tx_bytes_per_sec = 6;
}

message StatusChange {
  string status = 1; // installing | offline | starting | running | stopping | crashed
  string detail = 2;
}

message InstallProgress {
  string step = 1;
  double percent = 2;
  string detail = 3;
}
