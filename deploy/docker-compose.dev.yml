name: quarry-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  panel:
    build:
      context: ..
      dockerfile: deploy/panel.Dockerfile
    environment:
      QUARRY_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      QUARRY_HTTP_ADDR: ":8080"
      QUARRY_GRPC_ADDR: ":9010"
      QUARRY_DATA_DIR: /var/lib/quarry
      QUARRY_TLS_DNS_NAMES: panel,localhost
      QUARRY_ENV: dev
    volumes:
      - panel-data:/var/lib/quarry
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  daemon:
    build:
      context: ..
      dockerfile: deploy/daemon.Dockerfile
    # Run as the host user so sibling Minecraft containers (which inherit
    # this UID) can write the bind-mounted server directories. group_add
    # grants access to the host's docker socket group.
    user: "${QUARRY_DOCKER_UID:-1000}:${QUARRY_DOCKER_GID:-1000}"
    group_add:
      - "${QUARRY_DOCKER_SOCK_GID:?set QUARRY_DOCKER_SOCK_GID in deploy/.env (stat -c %g /var/run/docker.sock)}"
    environment:
      QUARRY_PANEL_ADDR: panel:9010
      QUARRY_NODE_NAME: local-dev
      QUARRY_DATA_DIR: /state
      # Sibling Minecraft containers bind-mount this literal path, so it must
      # be identical inside the daemon and on the docker host.
      QUARRY_SERVERS_DIR: ${QUARRY_HOST_SERVERS_DIR:?set QUARRY_HOST_SERVERS_DIR in deploy/.env (absolute host path)}
      QUARRY_CONTAINER_UID: ${QUARRY_DOCKER_UID:-1000}
      QUARRY_CA_FILE: /ca/ca.crt
      QUARRY_ENROLLMENT_TOKEN: ${QUARRY_ENROLLMENT_TOKEN:-}
      # Address browsers use to reach ports the daemon publishes (map UI).
      QUARRY_PUBLIC_HOST: ${QUARRY_PUBLIC_HOST:-localhost}
      # The daemon is bridged; the router reaches published server ports
      # through the docker host gateway.
      QUARRY_ROUTER_DIAL_HOST: host.docker.internal
      QUARRY_ENV: dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Handshake router relay. Servers must not claim this host port while
      # the router is enabled (move them via the server's Network settings).
      - "${QUARRY_ROUTER_PORT:-25565}:25565"
    volumes:
      - ${QUARRY_HOST_DAEMON_DIR:-../data/daemon}:/state
      # Same literal path inside the daemon and on the host (see
      # QUARRY_SERVERS_DIR) so sibling containers can bind-mount it.
      - ${QUARRY_HOST_SERVERS_DIR}:${QUARRY_HOST_SERVERS_DIR}
      # The panel generates ca.crt here on first boot; the daemon pins it.
      - panel-data:/ca:ro
      # Container management.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - panel

volumes:
  pgdata:
  panel-data:
