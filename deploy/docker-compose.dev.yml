name: quarry-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  panel:
    build:
      context: ..
      dockerfile: deploy/panel.Dockerfile
    environment:
      QUARRY_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      QUARRY_HTTP_ADDR: ":8080"
      QUARRY_GRPC_ADDR: ":9010"
      QUARRY_DATA_DIR: /var/lib/quarry
      QUARRY_TLS_DNS_NAMES: panel,localhost
      QUARRY_ENV: dev
    volumes:
      - panel-data:/var/lib/quarry
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  daemon:
    build:
      context: ..
      dockerfile: deploy/daemon.Dockerfile
    environment:
      QUARRY_PANEL_ADDR: panel:9010
      QUARRY_NODE_NAME: local-dev
      QUARRY_DATA_DIR: /var/lib/quarry-daemon
      QUARRY_CA_FILE: /ca/ca.crt
      QUARRY_ENROLLMENT_TOKEN: ${QUARRY_ENROLLMENT_TOKEN:-}
      QUARRY_ENV: dev
    volumes:
      - daemon-data:/var/lib/quarry-daemon
      # The panel generates ca.crt here on first boot; the daemon pins it.
      - panel-data:/ca:ro
      # Container management lands in Phase 1.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - panel

volumes:
  pgdata:
  panel-data:
  daemon-data:
