version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck
    - misspell
    - revive
    - unconvert
    - unparam
    - copyloopvar
  settings:
    revive:
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
